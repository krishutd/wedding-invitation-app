<!doctype html><html><head><style>iframe{position:fixed;right:12px;top:70px}pre{max-width:calc(100vw - 470px);max-height:80vh;overflow:auto}</style><title>Artwork handoff checks</title></head><body>
<button id="run">Run artwork checks</button><button id="inspect">Inspect artwork slowly</button><button id="still">Inspect glitter frame</button><pre id="results">Ready</pre><iframe title="Invitation preview" style="width:320px;height:480px"></iframe>
<script type="module">
const frame=document.querySelector('iframe'), out=document.querySelector('pre');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async fn=>{for(let n=0;n<700;n++){if(fn())return;await wait(20);}throw Error('Timeout');};
const check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
async function load(query,mode='normal',width=320,height=480){
 frame.style.width=width+'px';frame.style.height=height+'px';
 frame.src=(mode==='reduced'?'/tests/reduced.html':'/')+'?opening=enhanced&'+query;
 await new Promise(r=>frame.onload=r);
 const w=frame.contentWindow,d=w.document;
 await until(()=>d.querySelector('.envelope-stage')); await d.fonts.ready;await until(()=>d.querySelector('.opening-composition').getAttribute('aria-busy')==='false');await wait(1000);
 const animate=w.Element.prototype.animate;
 if(mode==='failure')w.Element.prototype.animate=()=>{throw Error('Simulated animation failure');};
 if(!['failure','reduced','slow'].includes(mode))w.Element.prototype.animate=function(frames,opts){
  const animation=animate.call(this,frames,opts);
  const timer=setTimeout(()=>{if(animation.playState==='running')animation.finish();},(opts.duration||0)+(opts.delay||0)+20);
  animation.finished.then(()=>clearTimeout(timer),()=>clearTimeout(timer));return animation;
 };
 if(mode==='slow'){
  const timer=w.setTimeout.bind(w);w.setTimeout=(fn,ms,...args)=>timer(fn,ms===10000?100000:ms===17000?170000:ms,...args);
  w.Element.prototype.animate=function(frames,opts){return animate.call(this,frames,{...opts,duration:this.closest('.artwork-handoff')?opts.duration*3:opts.duration});};
 }
 const started=performance.now();
 d.querySelector('.envelope-stage').click();d.querySelector('.envelope-stage').click();
 return {w,d,started};
}
document.querySelector('#inspect').onclick=()=>load('side=bride','slow',375,700);
document.querySelector('#still').onclick=async()=>{const {d}=await load('side=bride','slow',375,700);await until(()=>d.querySelector('.formation-glitter')?.getAnimations().length);const animation=d.querySelector('.formation-glitter').getAnimations()[0];await until(()=>Number(animation.currentTime)/animation.effect.getTiming().duration>.45);d.querySelectorAll('.artwork-handoff *').forEach(n=>n.getAnimations().forEach(a=>a.pause()));out.textContent='Paused at the forming-artwork moment. Reload to reset.';};
document.querySelector('#run').onclick=async()=>{
 out.textContent='';
 try{
 const cases=[
 ['invite=wedding',19,1,'normal',320,480,'below'],
 ['invite=reception&side=bride',21,1,'normal',390,1000,'near'],
 ['',19,2,'normal',375,667,'below'],
 ['invite=invalid',19,2,'skip',320,480],
 ['invite=wedding',19,1,'resize',375,700],
 ['invite=reception',21,1,'reduced',320,480],
 ['invite=wedding',19,1,'failure',320,480],
 ['invite=wedding',19,1,'key',320,480],
 ['invite=wedding',19,1,'asset',320,480],
 ['invite=wedding',19,1,'canvas',320,480],
 ];
 for(const [query,day,count,mode,width,height,route] of cases){
  const {w,d,started}=await load(query,mode,width,height);
  let measured;
  if(mode==='canvas')w.HTMLCanvasElement.prototype.getContext=()=>null;
  if(mode==='asset')w.HTMLImageElement.prototype.decode=()=>Promise.reject(Error('decode failure'));
  if(['normal','skip','resize','key'].includes(mode)){
   await until(()=>d.querySelector('.artwork-handoff')?.dataset.phase==='threads');
   const flapStarted=performance.now();
   check(d.querySelectorAll('.story-thread').length===3,'A seam strand and two border paths exist');
   check(d.querySelector('.opening-composition').dataset.stage==='flap','Light releases during flap opening');
   await until(()=>d.querySelector('.artwork-handoff')?.dataset.phase==='reveal');
   const prepared=d.querySelector('.invitation-prepared');
   check(d.querySelector('.portal-ring').getAttribute('d').includes(' A'),'One circular ring surrounds the artwork');
   check(d.querySelector('.portal-orbit').getAnimations().some(a=>a.playState==='running'),'Circular thread moves during artwork formation');
   check(d.querySelectorAll('.portal-dust').length===80,'Ring releases delicate gold dust');
   check(d.querySelector('.invitation-border-host').style.clipPath!=='','Border hidden until its tracing phase');
   check(w.getComputedStyle(prepared).visibility==='hidden','Wording concealed during reveal');
   check(prepared.inert && prepared.getAttribute('aria-hidden')==='true','Invisible controls excluded');
   check(w.getComputedStyle(d.querySelector('#invitation .divine-art')).visibility==='hidden','Final artwork hidden while transition copy reveals');
   if(mode==='skip')w.dispatchEvent(new w.WheelEvent('wheel',{deltaY:300}));
   if(mode==='key')w.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Tab'}));
   if(mode==='resize'){frame.style.width='430px';}
   if(mode==='normal'){
    await wait(800);
    const glitter=d.querySelector('.formation-glitter');
    check(glitter && w.getComputedStyle(d.querySelector('.handoff-art img')).visibility==='hidden','Canvas owns the forming artwork');
    const pixels=glitter.getContext('2d').getImageData(0,0,glitter.width,glitter.height).data;
    check(pixels.some((value,i)=>i%4===3 && value>40),'Meeting-centred artwork and sparse sparks are painted');
    await until(()=>d.querySelector('.artwork-handoff')?.dataset.phase==='settling');
    check(d.querySelector('.artwork-handoff').dataset.destination===route,'Destination route '+route+' at '+width+'x'+height);
    const target=d.querySelector('#invitation .divine-art').getBoundingClientRect(); measured=target;
    check(w.getComputedStyle(d.querySelector('.intro-screen')).visibility==='hidden','Envelope concealed during settling');
    check(w.getComputedStyle(d.querySelector('#invitation .divine-art')).visibility==='hidden','No second visible artwork during settling');
    check([...d.querySelectorAll('.story-thread')].slice(1,3).every(p=>!/[QC]/.test(p.getAttribute('d'))),'Border strands use straight perimeter paths without arches');
    check(!d.querySelector('.invitation-vine'),'Leaf corner decorations removed');
    check(performance.now()-flapStarted<7500,'Reveal and breathing pause leave time for the card arrival');
    {
     const moving=d.querySelector('.handoff-art');
     const motion=moving.getAnimations().find(a=>a.effect.getKeyframes().some(f=>f.transform));
     check(motion.effect.getKeyframes().every(f=>f.opacity===undefined || Number(f.opacity)===1),'Artwork never fades out during movement');
     const matrix=new w.DOMMatrix(motion.effect.getKeyframes().at(-1).transform);
     const origin=motion.effect.target;
     // CSS translate centres the unscaled art; transform targets viewport pixel bounds.
     check(Math.abs(matrix.a-target.width/origin.offsetWidth)<.02,'Continuous artwork matches destination scale');
    }
   }
  }
  await until(()=>d.querySelector('#invitation')&&!d.querySelector('.intro-screen')&&!d.querySelector('.artwork-handoff'));
  await wait(120);
  if(measured){const final=d.querySelector('.divine-art').getBoundingClientRect();check(['left','top','width','height'].every(k=>Math.abs(final[k]-measured[k])<1),'Final layout matches measured destination');}
  check(performance.now()-started<13500,'Tap to ready within budget: '+mode);
  check(d.querySelectorAll('.ceremony-card').length===count,'Correct variant '+query);
  check(d.querySelector('.event-heart').parentElement.textContent===String(day),'Correct selected day '+day);
  check(w.getComputedStyle(d.querySelector('.divine-art')).visibility==='visible','Original artwork fully visible');
  check(d.querySelectorAll('.divine-art').length===1 && !d.querySelector('.art-fleck, .formation-glitter'),'No duplicate art or particles');
  check(!d.querySelector('[inert]'),'Focus restriction released');
  check(w.scrollY===0,'No automatic scrolling');
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'No horizontal overflow');
  check([...d.querySelectorAll('.map-link')].every(a=>a.href.startsWith('https://maps.app.goo.gl/')),'Map destinations preserved');
  d.querySelector('.music-toggle').click();await wait(50);
  check(d.querySelector('.music-toggle').getAttribute('aria-pressed')==='false','Music toggle works');
  w.scrollTo({top:d.body.scrollHeight,behavior:'instant'});await wait(180);
  check(w.scrollY>0,'Normal scrolling restored');
  w.scrollTo({top:0,behavior:'instant'});await wait(120);
  check(!d.querySelector('.art-fleck, .formation-glitter') && d.querySelector('.divine-art').getAnimations().length===0,'Artwork never replays on scroll');
  out.textContent+='CASE COMPLETE '+mode+'\n';
 }
 out.textContent+='DONE\n';
 }catch(e){out.textContent+='FAIL '+e.stack+'\n';}
};
</script></body></html>
