<!doctype html><html><head><title>Invitation parameter checks</title></head><body>
<button>Run parameter checks</button><pre>Ready</pre><iframe style="width:375px;height:667px" title="Invitation preview"></iframe>
<script type="module">
const frame=document.querySelector('iframe'), output=document.querySelector('pre');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const until=async predicate=>{const start=Date.now();while(!predicate()){if(Date.now()-start>15000)throw Error('Timeout');await wait(25);}};
const check=(ok,label)=>{if(!ok)throw Error(label);output.textContent+='PASS '+label+'\n';};
document.querySelector('button').onclick=async()=>{
 output.textContent='';
 try {
 for(const [query,count,first,day] of [
 ['?i=4083fa314b9e',2,'Krishnanand','19'],
 ['?i=c12fbfce202e',1,'Archa','21'],
 ['?i=4f6a2ae57f7d&opening=classic&thread=invalid',1,'Krishnanand','19'],
 ['?i=41c745e64ec8',1,'Archa','19'],
 ['?i=b03f8bce7920',2,'Archa','19'],
 ['?i=e7713c25d1c8&side=bride&invite=wedding',1,'Krishnanand','21']]) {
 frame.src='/'+query;
 await new Promise(r=>frame.onload=r);
 const doc=frame.contentDocument;
 await until(()=>doc.querySelector('.envelope-stage')?.disabled===false);
 check(Boolean(doc.querySelector('.thread-tug')),'Permanent thread opening');
 check(doc.querySelector('.date-selected').textContent.trim()===day,'Selected event date');
 check(doc.querySelector('audio').src.endsWith('/wedding-music-2.mp3'),'Enhanced music');
 frame.contentWindow.Element.prototype.animate=()=>{throw Error('Skip animation');};
 doc.querySelector('.envelope-stage').click();
 await until(()=>doc.querySelector('#invitation')&&!doc.querySelector('.intro-screen'));
 check(doc.querySelectorAll('.ceremony-card').length===count,'Event selection '+query);
 check(doc.querySelector('.couple-names h2').textContent===first,'Family ordering '+query);
 }
 output.textContent+='DONE';
 }catch(e){output.textContent+='FAIL '+e.message;}
};
</script></body></html>
